<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATHVERSE — Ғарыш миссиясы</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080f23;color:white;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;padding:12px 17px;border:1px solid #bba4ff60;
border-radius:13px;background:#ffffff12;color:white}
button:hover{background:#ffffff25}
button:disabled{cursor:default;opacity:.55}
header,main,footer{max-width:1200px;margin:auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;letter-spacing:2px;color:#dcc4ff}
.panel{padding:23px;border-radius:23px;border:1px solid #b79aff40;
background:linear-gradient(130deg,#242943,#15152b)}
h1{font-size:clamp(29px,5vw,46px);margin:12px 0}
p{color:#ced1e2;line-height:1.6}
label{font-size:14px}
input[type=text]{display:block;width:100%;padding:14px;margin:10px 0;
background:#10172b;color:#fff;border:1px solid #bc9df060;border-radius:12px}
.primary{background:linear-gradient(125deg,#a063f2,#6942d1);
border:0;font-weight:bold}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
#notice{min-height:24px;color:#ffdd99}
.preview{display:flex;justify-content:space-between;gap:18px;
align-items:center;padding:14px 0;border-bottom:1px solid #ffffff20;font-size:21px}
.frac{display:inline-flex;flex-direction:column;align-items:center;
vertical-align:middle;line-height:1.1;margin:0 5px}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 3px}
.frac>span:last-child{padding:3px 4px 0}
#game,#result{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;
gap:10px;flex-wrap:wrap;margin-bottom:14px}
#scene{position:relative;aspect-ratio:1664/941;overflow:hidden;
border-radius:18px;isolation:isolate;
background:url("./space-bg.png") center/100% 100% no-repeat}
#ship{position:absolute;left:25%;top:73%;width:24%;z-index:5;
transform:translate(-50%,-50%);
filter:drop-shadow(0 8px 6px #0008)}
#ship img{width:100%;display:block;position:relative;z-index:2}
#flame{position:absolute;left:-10%;top:70%;width:35%;height:16%;
border-radius:50%;transform:rotate(-30deg);opacity:0;
background:linear-gradient(90deg,transparent,#ad65ff,#8ceaff,#fff);
filter:blur(3px);transform-origin:right center;z-index:1}
#ship.flying #flame{opacity:1;animation:fire .12s infinite alternate}
@keyframes fire{to{scale:1.3 1}}
#target{position:absolute;z-index:8;left:13%;top:48%;width:17%;height:27%;
border:3px dashed #ffe19a;border-radius:18px;background:#ffe4a53b;
display:grid;place-items:center;color:#fff3ce;
font-size:clamp(16px,3vw,32px);font-weight:bold;padding:0;
box-shadow:0 0 22px #ffdf8b66;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 35px #ffe598aa}}
#target.error{background:#ff5a7588}
#target.over{background:#95ffd788}
#fuel-panel{position:absolute;left:12px;top:12px;z-index:9;
padding:10px;background:#10162bdd;border:1px solid #b1d9ff77;border-radius:12px}
#fuel-bar{height:12px;width:110px;background:#fff2;border-radius:8px;overflow:hidden}
#fuel-fill{height:100%;width:0;background:linear-gradient(90deg,#a875ff,#9affd5);
transition:width .7s}
#fuel-text{font-size:12px;margin-bottom:6px;color:#ddedff}
#map-note{position:absolute;left:12px;bottom:10px;z-index:10;
background:#11192ddd;border:1px solid #b9a5ee66;
border-radius:10px;padding:8px 12px;font-size:13px}
#dock-glow{position:absolute;left:81%;top:23%;width:10%;height:17%;
border-radius:50%;background:#a2ffed33;opacity:0;
box-shadow:0 0 40px #8fffe5;transition:opacity 1s}
#dock-glow.active{opacity:1}
.task{margin-top:15px;padding:15px;text-align:center;
background:#10182c;border:1px solid #b89ae94d;border-radius:16px}
#question{font-size:clamp(27px,4vw,40px);line-height:1.8}
#instruction{color:#ffe29b;margin:6px 0}
#inventory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}
.item{min-height:95px;font-size:25px;font-weight:bold;
background:linear-gradient(135deg,#5c4787,#202c48);
border:2px solid #c2a1ff;touch-action:none;user-select:none}
.item.selected{outline:3px solid #ffe9a4;outline-offset:3px}
.item.wrong{opacity:.35}
.item.fuel{background:linear-gradient(135deg,#376d73,#183a4c);border-color:#90e9dd}
.item.dock{background:linear-gradient(135deg,#775789,#3a2c53);border-color:#e4b4f3}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;
transform:translate(-50%,-50%);padding:14px 22px;
border-radius:13px;background:#563e7bf0;border:2px solid #ffe5a0;
color:white;font-size:25px;box-shadow:0 8px 25px #0008}
#launch{display:none;margin:15px auto 0}
#dock-control{display:none;margin-top:16px;padding:17px;
border:1px solid #b9a6f570;border-radius:16px;background:#17213b;text-align:center}
#alignment{width:min(500px,100%);accent-color:#b995ff}
#align-value{font-size:21px;color:#c5f5ff;margin:10px}
#feedback{min-height:55px;text-align:center;padding:15px;font-weight:bold}
#finish{display:none;margin:auto}
#result{text-align:center;padding:40px 20px}
#stars{font-size:58px;color:#ffe08d}
footer{text-align:center;color:#a9b3c9;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
@media(max-width:650px){
header,main{padding:10px}.panel{padding:14px}.brand{font-size:13px}
#inventory{grid-template-columns:1fr 1fr;gap:9px}
.item{min-height:80px;font-size:23px}
#fuel-panel{padding:6px;left:6px;top:6px}
#fuel-bar{width:65px;height:8px}#fuel-text{font-size:9px}
#map-note{font-size:10px;padding:5px 8px;left:6px;bottom:6px}
#target{border-width:2px}
#instruction{font-size:13px}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
<div class="brand">MATHVERSE ✦</div>
<button id="sound" aria-pressed="false">♫ Күйді қосу</button>
</header>
<main>
<section id="setup" class="panel">
<p>5-СЫНЫП · II ТОҚСАН</p>
<h1>Ғарыш миссиясы</h1>
<p>Кемеге отын құйыңыз, ғарыш бағытын реттеңіз,
орбиталық станцияға қауіпсіз түйісіңіз!</p>
<label>Сабақ тақырыбы
<input id="topic" list="topics" placeholder="Мысалы: Жай бөлшектерді қосу">
</label>
<datalist id="topics">
<option value="Жай бөлшектерді ортақ бөлімге келтіру">
<option value="Жай бөлшектерді салыстыру">
<option value="Аралас сандарды салыстыру">
<option value="Жай бөлшектерді қосу және азайту">
<option value="Аралас сандарды қосу және азайту">
<option value="Жай бөлшектерді көбейту">
<option value="Аралас сандарды көбейту">
<option value="Өзара кері сандар">
<option value="Жай бөлшектерді бөлу">
<option value="Аралас сандарды бөлу">
</datalist>
<div class="actions">
<button id="generate" class="primary">✦ Миссияны дайындау</button>
<button id="start" hidden>Ғарышқа аттану →</button>
</div>
<p id="notice" role="status"></p><div id="preview"></div>
</section>

<section id="game" class="panel">
<div class="hud">
<strong id="stage"></strong><span id="score"></span>
<button id="back">← Тақырыпқа қайту</button>
</div>
<div id="scene">
<div id="fuel-panel">
<div id="fuel-text">Отын: 0%</div>
<div id="fuel-bar"><div id="fuel-fill"></div></div>
</div>
<div id="dock-glow"></div>
<div id="ship"><div id="flame"></div>
<img src="./space-ship.png" alt="Ғарыш кемесі"></div>
<button id="target" aria-label="Жауапты орналастыру орны">⛽</button>
<div id="map-note">Кеме ұшуға дайындалуда</div>
</div>
<div class="task">
<div id="label"></div><div id="question"></div>
<p id="instruction"></p>
</div>
<div id="inventory"></div>
<button id="launch" class="primary">🚀 Кемені ұшыру</button>
<div id="dock-control">
<p>Түйісу бағытын <b>50</b> белгісіне реттеңіз.</p>
<input id="alignment" type="range" min="0" max="100" value="0"
aria-label="Түйісу бағыты">
<div id="align-value">Бағыт: 0</div>
<button id="dock-button" class="primary">Станцияға түйісу</button>
</div>
<div id="feedback" role="status" aria-live="polite"></div>
<button id="finish" class="primary">Нәтижені көру →</button>
</section>

<section id="result" class="panel">
<div id="stars"></div><h1>Миссия орындалды!</h1>
<p id="summary"></p>
<button id="again" class="primary">Жаңа миссия</button>
<button id="choose">Тақырыпты өзгерту</button>
</section>
</main>
<footer>Авторы: Қонысғали Нұрасыл · MATHVERSE</footer>
<audio id="music" src="./adai.mp3" loop preload="none"></audio>
<canvas id="confetti"></canvas>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function F(n,d=1){
 if(!d)throw Error("Нөлге бөлу");
 const g=gcd(n,d);return{n:n/g,d:d/g};
}
const equal=(a,b)=>a.n*b.d===b.n*a.d;
const frac=(n,d)=>'<span class="frac"><span>'+n+
'</span><span>'+d+'</span></span>';
function show(a){
 if(a.d===1)return String(a.n);
 const w=Math.floor(a.n/a.d);
 return(w?w+" ":"")+frac(a.n%a.d,a.d);
}
function proper(){const d=rand(2,12);return F(rand(1,d-1),d)}
function mixed(){const a=proper();return F(rand(1,4)*a.d+a.n,a.d)}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
 const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]]}return a;
}
function parse(t){
 t=t.toLowerCase();
 if(t.includes("ортақ")&&t.includes("бөлім"))return["common"];
 if(t.includes("салыстыр"))return[t.includes("аралас")?"mcompare":"compare"];
 if(t.includes("кері"))return["inverse"];
 const a=[],p=t.includes("аралас")?"m":"";
 if(t.includes("қосу")||t.includes("қосынды"))a.push(p+"add");
 if(t.includes("азайт")||t.includes("айырма"))a.push(p+"sub");
 if(t.includes("көбей"))a.push(p+"mul");
 if(t.includes("бөлу")||t.includes("бөлің"))a.push(p+"div");
 return a;
}
function options(answer){
 const a=[answer];let tries=0;
 while(a.length<4&&tries++<100){
 const b=F(rand(1,Math.max(15,answer.n+8)),rand(1,12));
 if(!a.some(x=>equal(x,b)))a.push(b);
 }
 for(let i=1;a.length<4;i++){
 const b=F(answer.n+i*answer.d,answer.d);
 if(!a.some(x=>equal(x,b)))a.push(b);
 }
 return shuffle(a).map(x=>({html:show(x),correct:equal(x,answer)}));
}
function make(type){
 if(type==="common"){
 let a=proper(),b=proper();while(a.d===b.d)b=proper();
 const d=a.d/gcd(a.d,b.d)*b.d,n=a.n*d/a.d,m=b.n*d/b.d;
 const pair=(x,y)=>frac(x,d)+" және "+frac(y,d);
 return{label:"Ең кіші ортақ бөлімге келтіріңіз",q:show(a)+" және "+show(b),
 answer:pair(n,m),options:shuffle([
 {html:pair(n,m),correct:true},{html:pair(n+1,m),correct:false},
 {html:pair(n,m+1),correct:false},{html:pair(n+1,m+1),correct:false}])};
 }
 if(type==="inverse"){
 const a=Math.random()<.5?proper():mixed(),r=F(a.d,a.n);
 return{label:"Кері санды табыңыз",q:show(a),answer:show(r),options:options(r)};
 }
 const m=type.startsWith("m"),op=m?type.slice(1):type;
 let a=m?mixed():proper(),b=m?mixed():proper();
 if(op==="compare"){
 const x=a.n*b.d-b.n*a.d,answer=x===0?"=":x>0?"&gt;":"&lt;";
 return{label:"Қай белгі дұрыс?",q:show(a)+" ☐ "+show(b),answer,
 options:shuffle(["&lt;","=","&gt;"].map(html=>({html,correct:html===answer})))};
 }
 if(op==="sub"&&a.n*b.d<b.n*a.d)[a,b]=[b,a];
 let r,s;
 if(op==="add"){r=F(a.n*b.d+b.n*a.d,a.d*b.d);s="+"}
 if(op==="sub"){r=F(a.n*b.d-b.n*a.d,a.d*b.d);s="−"}
 if(op==="mul"){r=F(a.n*b.n,a.d*b.d);s="×"}
 if(op==="div"){r=F(a.n*b.d,a.d*b.n);s="÷"}
 return{label:"Есептеңіз",q:show(a)+" "+s+" "+show(b),
 answer:show(r),options:options(r)};
}

let tasks=[],step=0,points=0,perfect=0,first=true,busy=false;
let selected=null,epoch=0,mode="setup",dragState=null;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function generate(){
 const types=parse($("topic").value);
 if(!types.length){
 tasks=[];$("preview").replaceChildren();$("start").hidden=true;
 $("notice").textContent="Тақырып танылмады. Тізімдегі тақырыпты таңдаңыз.";
 return false;
 }
 tasks=[];const seen=new Set();let tries=0;
 while(tasks.length<8&&tries++<1000){
 const t=make(types[rand(0,types.length-1)]);
 if(!seen.has(t.q)){seen.add(t.q);tasks.push(t)}
 }
 $("preview").innerHTML="<p>Мұғалімге алдын ала қарау · 8 есеп</p>"+
 tasks.map((t,i)=>'<div class="preview"><span>'+(i+1)+'. '+t.q+
 '</span><span style="color:#a6f2d8">'+t.answer+'</span></div>').join("");
 $("notice").textContent="Отынға 3 есеп, бағытқа 3 есеп, түйісуге 2 есеп дайын.";
 $("start").hidden=false;return true;
}
$("generate").onclick=generate;
$("topic").oninput=()=>{
 tasks=[];$("preview").replaceChildren();$("start").hidden=true;
 $("notice").textContent="";
};
function placeShip(x,y,w){
 $("ship").style.left=x+"%";$("ship").style.top=y+"%";
 $("ship").style.width=w+"%";
}
async function fly(destination,ticket){
 const a={x:parseFloat($("ship").style.left),
 y:parseFloat($("ship").style.top),w:parseFloat($("ship").style.width)};
 const duration=matchMedia("(prefers-reduced-motion: reduce)").matches?1:1700;
 const begin=performance.now();$("ship").classList.add("flying");
 await new Promise(resolve=>{
 function frame(now){
 if(ticket!==epoch){resolve();return}
 const t=Math.min(1,(now-begin)/duration),e=t*t*(3-2*t);
 placeShip(a.x+(destination.x-a.x)*e,
 a.y+(destination.y-a.y)*e,a.w+(destination.w-a.w)*e);
 if(t<1)requestAnimationFrame(frame);else resolve();
 }requestAnimationFrame(frame);
 });
 if(ticket===epoch)$("ship").classList.remove("flying");
}
function setFuel(value){
 $("fuel-fill").style.width=value+"%";$("fuel-text").textContent="Отын: "+value+"%";
}
function target(x,y,w,h,text){
 const t=$("target");
 t.style.left=x+"%";t.style.top=y+"%";t.style.width=w+"%";t.style.height=h+"%";
 t.textContent=text;t.hidden=false;t.disabled=false;
}
function start(){
 if(!tasks.length&&!generate())return;
 epoch++;step=0;points=0;perfect=0;busy=false;mode="task";
 setFuel(0);placeShip(25,73,24);
 $("ship").style.opacity="1";$("ship").classList.remove("flying");
 $("dock-glow").classList.remove("active");
 $("launch").style.display="none";$("finish").style.display="none";
 $("dock-control").style.display="none";$("alignment").value=0;
 $("align-value").textContent="Бағыт: 0";
 $("dock-button").disabled=false;
 $("setup").style.display="none";$("result").style.display="none";
 $("game").style.display="block";render();
}
function render(){
 mode="task";busy=false;first=true;selected=null;
 $("inventory").replaceChildren();
 $("label").textContent=tasks[step].label;$("question").innerHTML=tasks[step].q;
 $("score").textContent="✦ "+points+" ұпай";
 $("feedback").textContent="Затты сүйреңіз немесе затты, кейін белгіленген орынды басыңыз.";
 let kind="";
 if(step<3){
 $("stage").textContent="1-кезең · Отын "+(step+1)+"/3";
 $("instruction").textContent="Дұрыс жауапты отын капсуласын кемеге апарыңыз.";
 $("map-note").textContent="Отын толмайынша кеме ұшпайды";
 target(17,55,16,23,"⛽");kind="fuel";
 }else if(step<6){
 $("stage").textContent="2-кезең · Бағыт "+(step-2)+"/3";
 $("instruction").textContent="Дұрыс жауапты навигация модулін жарық белгісіне апарыңыз.";
 $("map-note").textContent="Келесі бағдаршамға бағыт алыңыз";
 const p=[{x:55,y:45},{x:66,y:40},{x:76,y:34}][step-3];
 target(p.x-4,p.y-6,10,16,"◎");
 }else{
 $("stage").textContent="3-кезең · Түйісу коды "+(step-5)+"/2";
 $("instruction").textContent="Дұрыс жауапты кодты станцияның қақпасына апарыңыз.";
 $("map-note").textContent="Станцияға түйісу рұқсатын алыңыз";
 target(81,23,10,17,"✦");kind="dock";
 }
 tasks[step].options.forEach(opt=>{
 const b=document.createElement("button");b.className="item "+kind;
 b.innerHTML=opt.html;b._option=opt;
 b.onclick=()=>{
 if(busy||b.disabled||mode!=="task")return;
 if(selected)selected.classList.remove("selected");
 selected=b;b.classList.add("selected");
 $("feedback").textContent="Енді көріністегі жарқыраған орынды басыңыз.";
 };
 b.onpointerdown=e=>beginDrag(e,b);$("inventory").append(b);
 });
}
function cancelDrag(){
 dragState?.ghost?.remove();dragState=null;$("target").classList.remove("over");
}
function beginDrag(e,b){
 if(busy||b.disabled||e.button!==0||mode!=="task")return;
 cancelDrag();dragState={b,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};
 b.setPointerCapture(e.pointerId);
}
document.addEventListener("pointermove",e=>{
 const s=dragState;if(!s||s.id!==e.pointerId)return;
 if(Math.hypot(e.clientX-s.x,e.clientY-s.y)>8)s.moved=true;
 if(!s.moved)return;
 if(!s.ghost){
 s.ghost=document.createElement("div");s.ghost.className="drag-ghost";
 s.ghost.innerHTML=s.b.innerHTML;document.body.append(s.ghost);
 }
 s.ghost.style.left=e.clientX+"px";s.ghost.style.top=e.clientY+"px";
 const r=$("target").getBoundingClientRect();
 $("target").classList.toggle("over",
 e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom);
});
document.addEventListener("pointerup",e=>{
 const s=dragState;if(!s||s.id!==e.pointerId)return;
 const r=$("target").getBoundingClientRect();
 const hit=e.clientX>=r.left&&e.clientX<=r.right&&
 e.clientY>=r.top&&e.clientY<=r.bottom;
 const b=s.b,moved=s.moved;cancelDrag();
 if(moved&&hit)submit(b);
});
document.addEventListener("pointercancel",cancelDrag);
$("target").onclick=()=>{
 if(selected&&!busy&&mode==="task")submit(selected);
 else if(!busy)$("feedback").textContent="Алдымен жауап жазылған затты таңдаңыз.";
};

async function submit(b){
 if(busy||b.disabled||mode!=="task")return;
 busy=true;cancelDrag();const ticket=epoch;
 $("inventory").querySelectorAll("button").forEach(x=>x.disabled=true);
 if(!b._option.correct){
 first=false;b.dataset.wrong="1";b.classList.add("wrong");
 $("target").classList.add("error");tone(false);
 $("feedback").textContent="Жүйе кодты қабылдамады. Қайта есептеңіз!";
 await wait(550);if(ticket!==epoch)return;
 $("target").classList.remove("error");
 $("inventory").querySelectorAll("button").forEach(x=>x.disabled=x.dataset.wrong==="1");
 selected=null;b.classList.remove("selected");busy=false;return;
 }
 points+=first?10:5;if(first)perfect++;
 $("score").textContent="✦ "+points+" ұпай";
 $("target").hidden=true;tone(true);
 $("feedback").textContent="Код қабылданды! +"+(first?10:5)+" ұпай";
 if(step<3){
 setFuel(Math.round((step+1)*100/3));
 await wait(650);if(ticket!==epoch)return;
 if(step===2){
 mode="launch";$("inventory").replaceChildren();
 $("question").textContent="Отын толық!";
 $("instruction").textContent="Ұшыру батырмасын басыңыз.";
 $("map-note").textContent="Кеме ұшуға дайын";
 $("launch").style.display="block";busy=false;return;
 }
 }else if(step<6){
 const p=[{x:55,y:45,w:14},{x:66,y:40,w:11},{x:76,y:34,w:8}][step-3];
 await fly(p,ticket);if(ticket!==epoch)return;
 }else{
 await wait(650);if(ticket!==epoch)return;
 if(step===7){
 mode="align";$("inventory").replaceChildren();
 $("dock-control").style.display="block";
 $("question").textContent="Түйісу бағытын реттеңіз";
 $("label").textContent="Станцияның соңғы тексеруі";
 $("instruction").textContent="Жүгірткіні 50 белгісіне қойып, түйісуді бастаңыз.";
 $("map-note").textContent="Дәл бағыт қажет";
 busy=false;return;
 }
 }
 step++;render();
}
$("launch").onclick=async()=>{
 if(busy||mode!=="launch")return;
 busy=true;const ticket=epoch;$("launch").style.display="none";
 $("map-note").textContent="3… 2… 1… Ұшу!";
 tone(true);await wait(800);if(ticket!==epoch)return;
 await fly({x:43,y:55,w:18},ticket);if(ticket!==epoch)return;
 step=3;render();
};
$("alignment").oninput=()=>{
 $("align-value").textContent="Бағыт: "+$("alignment").value;
};
$("dock-button").onclick=async()=>{
 if(busy||mode!=="align")return;
 if(Number($("alignment").value)!==50){
 $("feedback").textContent="Бағыт сәйкес емес. Дәл 50 белгісіне қойыңыз.";
 tone(false);return;
 }
 busy=true;const ticket=epoch;$("dock-button").disabled=true;
 $("map-note").textContent="Түйісу орындалуда…";
 $("dock-glow").classList.add("active");tone(true);
 await fly({x:85,y:31,w:4},ticket);if(ticket!==epoch)return;
 $("ship").style.opacity=".3";
 $("map-note").textContent="Станцияға сәтті түйісті!";
 $("feedback").textContent="Миссия орындалды! Кеме қауіпсіз жетті.";
 celebrate();$("finish").style.display="block";mode="complete";
};
$("finish").onclick=()=>{
 if(mode!=="complete")return;
 epoch++;$("game").style.display="none";$("result").style.display="block";
 const r=points/80;
 $("stars").textContent=r>=.9?"★★★":r>=.65?"★★☆":"★☆☆";
 $("summary").textContent=points+" / 80 ұпай. Алғашқы әрекеттен дұрыс: "+
 perfect+" / 8. Отын толды, бағыт анықталды, кеме станцияға жетті!";
 celebrate();
};
function back(){
 epoch++;cancelDrag();mode="setup";
 $("ship").classList.remove("flying");
 $("game").style.display="none";$("result").style.display="none";
 $("setup").style.display="block";
}
$("start").onclick=start;$("back").onclick=back;$("choose").onclick=back;
$("again").onclick=()=>{if(generate())start()};
$("ship").querySelector("img").onerror=()=>{
 $("notice").textContent="space-ship.png файлын тексеріңіз.";
 $("map-note").textContent="Кеме суреті ашылмады";
};

let sound=false,ctx;
$("sound").onclick=async()=>{
 if(sound){$("music").pause();sound=false}
 else{
 try{
 $("music").volume=.2;await $("music").play();sound=true;
 const AC=window.AudioContext||window.webkitAudioContext;
 if(AC){ctx=ctx||new AC();await ctx.resume()}
 }catch(e){alert("adai.mp3 файлы ашылмады.")}
 }
 $("sound").textContent=sound?"♫ Күйді өшіру":"♫ Күйді қосу";
 $("sound").setAttribute("aria-pressed",String(sound));
};
function tone(ok){
 if(!sound||!ctx)return;
 [ok?523:160,ok?784:100].forEach((f,i)=>{
 const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.1;
 o.connect(g);g.connect(ctx.destination);o.frequency.value=f;
 g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
 o.start(t);o.stop(t+.25);
 });
}
let anim;
function celebrate(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 cancelAnimationFrame(anim);
 const c=$("confetti"),g=c.getContext("2d");
 c.width=innerWidth;c.height=innerHeight;
 const bits=Array.from({length:100},()=>({
 x:Math.random()*c.width,y:-Math.random()*c.height,
 v:2+Math.random()*5,color:["#ffe190","#d5afff","#91efff"][rand(0,2)]}));
 const begin=performance.now();
 function draw(now){
 g.clearRect(0,0,c.width,c.height);
 bits.forEach(p=>{p.y+=p.v;g.fillStyle=p.color;g.fillRect(p.x,p.y,6,10)});
 if(now-begin<3000)anim=requestAnimationFrame(draw);
 else g.clearRect(0,0,c.width,c.height);
 }anim=requestAnimationFrame(draw);
}
</script>
</body>
