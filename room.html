<!DOCTYPE html>
<html lang="kk">
<head>
 <base href="https://matimatica2027-del.github.io/mathverse/">
 <meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATHVERSE — Құпия бөлме</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#120f20;color:#fff;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;padding:12px 17px;border-radius:13px;
border:1px solid #cab1ff50;background:#ffffff12;color:#fff}
button:hover{background:#ffffff25}
button:disabled{cursor:default}
header,main,footer{max-width:1150px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-weight:900;letter-spacing:2px;color:#dfc7ff}
.audio{display:flex;align-items:center;gap:8px}
#volume{width:65px;accent-color:#bb86ff}
.panel{padding:24px;border:1px solid #c49dff35;border-radius:24px;
background:linear-gradient(130deg,#302240,#171427)}
h1{font-size:clamp(30px,5vw,48px);margin:12px 0}
p{color:#d6c9df;line-height:1.6}
label{display:block;color:#e1d3eb;font-size:14px}
.fields{display:grid;grid-template-columns:1fr 150px;gap:14px}
input[type=text],select{display:block;width:100%;margin-top:8px;padding:14px;
border:1px solid #c49dff55;border-radius:12px;background:#171226;color:#fff}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.primary{background:linear-gradient(120deg,#a367f5,#7135df);
border:0;font-weight:bold;box-shadow:0 6px 25px #9b54ff35}
.frac{display:inline-flex;flex-direction:column;align-items:center;
vertical-align:middle;line-height:1.1;margin:0 5px}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 3px}
.frac>span:last-child{padding:3px 4px 0}
.preview-row{display:flex;justify-content:space-between;align-items:center;
gap:18px;padding:15px 0;border-bottom:1px solid #ffffff18;font-size:21px}
#notice{min-height:24px;color:#ffdf9e}
#game,#result{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;
gap:10px;flex-wrap:wrap;margin-bottom:14px}
#locks{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}
.lock-dot{width:29px;height:29px;display:grid;place-items:center;
border-radius:50%;background:#ffffff12;border:1px solid #c2a0e35c;
color:#dbc8ed;font-size:12px}
.lock-dot.open{background:#674622;color:#ffe399;border-color:#e5bd68}
.lock-dot.current{outline:2px solid #d7abff;outline-offset:2px}
#scene{position:relative;aspect-ratio:1664/941;isolation:isolate;
background:url("./room-bg.png") center/100% 100% no-repeat;
border-radius:20px;overflow:hidden}
#doorway{position:absolute;left:38%;top:16.5%;width:24%;height:52%;
perspective:900px}
.door{position:absolute;top:0;width:50%;height:100%;
border:3px solid #bd9250;backface-visibility:hidden;
background:repeating-linear-gradient(90deg,#352039 0 15%,
#482c49 16% 29%,#2c1a30 30% 32%);
box-shadow:inset 0 0 28px #0009;transition:transform 1.8s ease}
.door:before{content:"✦";position:absolute;inset:14% 14%;
border:2px solid #d7ae65;display:grid;place-items:center;
font-size:clamp(24px,5vw,70px);color:#e6bf76;
background:linear-gradient(145deg,#ac79372b,#b481ce22)}
.door:after{content:"";position:absolute;top:55%;width:10%;height:8%;
border:2px solid #edcd8c;border-radius:50%}
.left-door{left:0;transform-origin:left center}
.left-door:after{right:8%}
.right-door{right:0;transform-origin:right center}
.right-door:after{left:8%}
#doorway.open .left-door{transform:rotateY(-105deg)}
#doorway.open .right-door{transform:rotateY(105deg)}
#door-lock{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);
width:28%;height:27%;display:grid;place-items:center;
font-size:clamp(18px,4vw,48px);background:linear-gradient(135deg,#ffe5a3,#b47930);
border:2px solid #fff0c5;border-radius:16%;z-index:3;
box-shadow:0 3px 20px #0008;transition:opacity .4s,filter .4s}
#door-lock.unlocking{animation:unlock .8s ease}
@keyframes unlock{
30%{transform:translate(-50%,-50%) rotate(-12deg)}
65%{transform:translate(-50%,-50%) rotate(12deg);filter:brightness(1.8)}
}
#doorway.open #door-lock{opacity:0}
#treasure{position:absolute;left:50%;bottom:4%;width:75%;
transform:translateX(-50%) scale(.6);opacity:0;
transition:opacity 1s .6s,transform 1.5s .6s}
#doorway.open #treasure{opacity:1;transform:translateX(-50%) scale(1)}
#treasure svg{width:100%;display:block;filter:drop-shadow(0 0 18px #ffd575)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;
background:radial-gradient(circle at 50% 45%,#ffe4a199,transparent 65%)}
#flash.spark{animation:spark .9s}
@keyframes spark{35%{opacity:1}100%{opacity:0}}
#scene.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.question{position:relative;z-index:5;margin:12px auto 0;width:fit-content;
max-width:90%;padding:9px 20px;text-align:center;border-radius:16px;
background:#160f28e8;border:1px solid #e7c38a88;backdrop-filter:blur(7px)}
#label{font-size:13px;color:#e7d6ec}
#question{font-size:clamp(23px,3.5vw,39px);line-height:1.8}
#scene-message{position:absolute;bottom:5%;left:50%;
transform:translateX(-50%);z-index:5;max-width:90%;width:max-content;
padding:9px 14px;background:#190f27da;border:1px solid #dcb87470;
border-radius:12px;text-align:center;color:#ffe2a4;font-size:14px}
#answers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.answer{min-height:94px;background:linear-gradient(145deg,#44284e,#211930);
border:2px solid #b889e2;font-size:26px;font-weight:bold}
.answer.correct{background:#275b44;border-color:#a4f3c5;
box-shadow:0 0 24px #82e8ab55}
.answer.wrong{background:#652c3a;border-color:#ff9da9}
#feedback{min-height:54px;text-align:center;padding:16px;font-weight:bold}
#next{display:none;margin:auto}
#result{text-align:center;padding:40px 20px}
#stars{font-size:58px;color:#ffdb81}
footer{text-align:center;color:#b5a4c4;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media(max-width:650px){
header,main{padding:12px}.brand{font-size:13px}.panel{padding:16px}
.fields{grid-template-columns:1fr}
#answers{grid-template-columns:1fr 1fr;gap:9px}
.answer{min-height:80px;font-size:24px}
.question{padding:4px 12px;margin-top:5px}
#question{font-size:22px}#label{font-size:10px}
#scene-message{font-size:10px;padding:5px 8px;bottom:3%}
#volume{width:45px}.audio{gap:4px}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
<div class="brand">MATHVERSE ✦</div>
<div class="audio">
<button id="sound" aria-pressed="false">♫ Күйді қосу</button>
<input id="volume" type="range" min="0" max="1" step=".05"
value=".25" aria-label="Күйдің дыбыс деңгейі">
</div>
</header>

<main>
<section id="setup" class="panel">
<p>5-СЫНЫП · II ТОҚСАН</p>
<h1>Құпия бөлме</h1>
<p>Бөлшектер кодын шешіңіз. Әр дұрыс жауап — бір ашылған құлып.
Барлық құлыпты ашып, қазынаға жетіңіз!</p>
<div class="fields">
<label>Сабақтың тақырыбы
<input type="text" id="topic" list="topics"
placeholder="Мысалы: Аралас сандарды қосу">
<datalist id="topics">
<option value="Жай бөлшектерді ортақ бөлімге келтіру">
<option value="Жай бөлшектерді салыстыру">
<option value="Аралас сандарды салыстыру">
<option value="Жай бөлшектерді қосу және азайту">
<option value="Аралас сандарды қосу және азайту">

<option value="Аралас сандарды көбейту">

<option value="Жай бөлшектерді бөлу">

<label>Құлып саны

</div>

fill="#75439a" stroke="url(#gold)" stroke-width="9"/>

fill="#54306f" stroke="url(#gold)" stroke-width="9"/>

stroke="url(#gold)" stroke-width="12"/>

</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function F(n,d=1){
 if(!d)throw Error("Нөлге бөлу");
 if(d<0){n=-n;d=-d}
 const g=gcd(n,d);return{n:n/g,d:d/g};
}
const equal=(a,b)=>a.n*b.d===b.n*a.d;
function fraction(n,d){
 return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';
}
function show(a){
 if(a.d===1)return String(a.n);
 const w=Math.floor(a.n/a.d),r=a.n%a.d;
 return(w?w+" ":"")+fraction(r,a.d);
}
function proper(){const d=rand(2,12);return F(rand(1,d-1),d)}
function mixed(){const a=proper();return F(rand(1,4)*a.d+a.n,a.d)}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];
 }return a;
}
function parse(text){
 const t=text.toLowerCase().trim();
 if(t.includes("ортақ")&&t.includes("бөлім"))return["common"];
 if(t.includes("салыстыр"))return[t.includes("аралас")?"mcompare":"compare"];
 if(t.includes("кері"))return["inverse"];
 const ops=[],p=t.includes("аралас")?"m":"";
 if(t.includes("қосу")||t.includes("қосынды"))ops.push(p+"add");
 if(t.includes("азайт")||t.includes("айырма"))ops.push(p+"sub");
 if(t.includes("көбей"))ops.push(p+"mul");
 if(t.includes("бөлу")||t.includes("бөлің"))ops.push(p+"div");
 return ops;
}
function options(answer){
 const a=[answer];let tries=0;
 while(a.length<4&&tries++<100){
  const b=F(rand(1,Math.max(15,answer.n+8)),rand(1,12));
  if(!a.some(x=>equal(x,b)))a.push(b);
 }
 for(let i=1;a.length<4;i++){
  const b=F(answer.n+i*answer.d,answer.d);
  if(!a.some(x=>equal(x,b)))a.push(b);
 }
 return shuffle(a).map(x=>({html:show(x),correct:equal(x,answer)}));
}
function make(type){
 if(type==="common"){
  let a=proper(),b=proper();while(a.d===b.d)b=proper();
  const d=a.d/gcd(a.d,b.d)*b.d,n=a.n*d/a.d,m=b.n*d/b.d;
  const pair=(x,y)=>fraction(x,d)+" және "+fraction(y,d);
  return{label:"Ең кіші ортақ бөлімге келтіріңіз",
   q:show(a)+" және "+show(b),answer:pair(n,m),
   options:shuffle([
    {html:pair(n,m),correct:true},
    {html:pair(n+1,m),correct:false},
    {html:pair(n,m+1),correct:false},
    {html:pair(n+1,m+1),correct:false}
   ])};
 }
 if(type==="inverse"){
  const a=Math.random()<.5?proper():mixed(),r=F(a.d,a.n);
  return{label:"Кері санды табыңыз",q:show(a),answer:show(r),options:options(r)};
 }
 const m=type.startsWith("m"),op=m?type.slice(1):type;
 let a=m?mixed():proper(),b=m?mixed():proper();
 if(op==="compare"){
  const x=a.n*b.d-b.n*a.d,answer=x===0?"=":x>0?"&gt;":"&lt;";
  return{label:"Қай белгі дұрыс?",q:show(a)+" ☐ "+show(b),answer,
   options:shuffle(["&lt;","=","&gt;"].map(html=>({
    html,correct:html===answer})))};
 }
 if(op==="sub"&&a.n*b.d<b.n*a.d)[a,b]=[b,a];
 let r,s;
 if(op==="add"){r=F(a.n*b.d+b.n*a.d,a.d*b.d);s="+"}
 if(op==="sub"){r=F(a.n*b.d-b.n*a.d,a.d*b.d);s="−"}
 if(op==="mul"){r=F(a.n*b.n,a.d*b.d);s="×"}
 if(op==="div"){r=F(a.n*b.d,a.d*b.n);s="÷"}
 return{label:"Есептеңіз",q:show(a)+" "+s+" "+show(b),
  answer:show(r),options:options(r)};
}

let tasks=[],index=0,points=0,perfect=0,opened=0;
let first=true,locked=false,token=0;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function generate(){
 const types=parse($("topic").value);
 if(!types.length){
  tasks=[];$("preview").replaceChildren();$("start").hidden=true;
  $("notice").textContent="Тақырып танылмады. Тізімдегі тақырыпты таңдаңыз.";
  return false;
 }
 tasks=[];const seen=new Set();let tries=0;
 while(tasks.length<Number($("count").value)&&tries++<1000){
  const t=make(types[rand(0,types.length-1)]);
  if(!seen.has(t.q)){seen.add(t.q);tasks.push(t)}
 }
 $("preview").innerHTML="<p>Мұғалімге алдын ала қарау</p>"+
 tasks.map((t,i)=>'<div class="preview-row"><span>'+(i+1)+'. '+t.q+
 '</span><span style="color:#b3efc5">'+t.answer+'</span></div>').join("");
 $("notice").textContent=tasks.length+" тапсырма дайын.";
 $("start").hidden=false;return true;
}
function invalidate(){
 tasks=[];$("preview").replaceChildren();$("start").hidden=true;
 $("notice").textContent="";
}
$("topic").oninput=invalidate;$("count").onchange=invalidate;
$("generate").onclick=generate;

function drawLocks(){
 $("locks").replaceChildren();
 tasks.forEach((_,i)=>{
  const dot=document.createElement("span");
  dot.className="lock-dot"+(i<opened?" open":"")+
   (i===index&&opened<=index?" current":"");
  dot.textContent=i<opened?"✓":i+1;
  dot.setAttribute("aria-label",i<opened?
   (i+1)+"-құлып ашылды":(i+1)+"-құлып жабық");
  $("locks").append(dot);
 });
}
function start(){
 if(!tasks.length&&!generate())return;
 token++;index=0;points=0;perfect=0;opened=0;
 $("doorway").classList.remove("open");
 $("door-lock").classList.remove("unlocking");
 $("door-lock").textContent="🔒";
 $("setup").style.display="none";$("result").style.display="none";
 $("game").style.display="block";render();
}
function render(){
 first=true;locked=false;
 $("progress").textContent="Құлып "+(index+1)+" / "+tasks.length;
 $("score").textContent="✦ "+points+" ұпай";
 $("label").textContent=tasks[index].label;
 $("question").innerHTML=tasks[index].q;
 $("feedback").textContent="Құлыпты ашатын дұрыс жауапты таңдаңыз.";
 $("scene-message").textContent="Ашылған құлып: "+opened+" / "+tasks.length;
 $("next").style.display="none";
 $("next").textContent="Келесі құлып →";
 $("answers").replaceChildren();
 drawLocks();
 tasks[index].options.forEach(opt=>{
  const b=document.createElement("button");
  b.className="answer";b.innerHTML=opt.html;
  b.onclick=()=>answer(b,opt);$("answers").append(b);
 });
}
async function answer(button,opt){
 if(locked)return;
 locked=true;const current=token;
 const buttons=[...$("answers").children];
 buttons.forEach(b=>b.disabled=true);
 if(!opt.correct){
  first=false;button.dataset.wrong="1";button.classList.add("wrong");
  $("scene").classList.add("shake");effect(false);
  $("feedback").textContent="Код сәйкес келмеді. Қайта есептеңіз!";
  await wait(500);if(current!==token)return;
  $("scene").classList.remove("shake");
  buttons.forEach(b=>b.disabled=b.dataset.wrong==="1");
  locked=false;return;
 }
 button.classList.add("correct");
 points+=first?10:5;if(first)perfect++;
 opened++;
 $("score").textContent="✦ "+points+" ұпай";
 $("door-lock").textContent="🔓";
 $("door-lock").classList.add("unlocking");
 $("flash").classList.add("spark");
 $("feedback").textContent=first?"Құлып ашылды! +10 ұпай":"Құлып ашылды! +5 ұпай";
 $("scene-message").textContent="Ашылған құлып: "+opened+" / "+tasks.length;
 effect(true);drawLocks();
 await wait(900);if(current!==token)return;
 $("door-lock").classList.remove("unlocking");
 $("flash").classList.remove("spark");

 if(opened===tasks.length){
  $("doorway").classList.add("open");
  $("scene-message").textContent="Барлық құлып ашылды! Қазына сіздікі!";
  $("feedback").textContent="Құпия бөлменің коды шешілді!";
  celebrate();
  await wait(2200);if(current!==token)return;
  $("next").textContent="Нәтижені көру →";
 }else{
  $("door-lock").textContent="🔒";
 }
 $("next").style.display="block";
}
$("next").onclick=()=>{
 index++;
 if(index<tasks.length)render();
 else{
  token++;$("game").style.display="none";$("result").style.display="block";
  const ratio=points/(tasks.length*10);
  $("stars").textContent=ratio>=.9?"★★★":ratio>=.65?"★★☆":"★☆☆";
  $("summary").textContent=points+" / "+tasks.length*10+
   " ұпай. Бірінші әрекеттен дұрыс: "+perfect+" / "+tasks.length+
   ". Барлық "+opened+" құлып ашылды!";
  celebrate();
 }
};
function back(){
 token++;$("game").style.display="none";$("result").style.display="none";
 $("setup").style.display="block";$("scene").classList.remove("shake");
 $("flash").classList.remove("spark");
}
$("start").onclick=start;$("back").onclick=back;$("choose").onclick=back;
$("again").onclick=()=>{if(generate())start()};

let sound=false,ctx;
$("sound").onclick=async()=>{
 if(sound){$("music").pause();sound=false}
 else{
  try{
   $("music").volume=Number($("volume").value);
   await $("music").play();sound=true;
   const AC=window.AudioContext||window.webkitAudioContext;
   if(AC){ctx=ctx||new AC();await ctx.resume()}
  }catch(e){alert("Күй ашылмады. adai.mp3 файлын тексеріңіз.")}
 }
 $("sound").textContent=sound?"♫ Күйді өшіру":"♫ Күйді қосу";
 $("sound").setAttribute("aria-pressed",String(sound));
};
$("volume").oninput=()=>{$("music").volume=Number($("volume").value)};
function effect(correct){
 if(!sound||!ctx)return;
 const now=ctx.currentTime;
 const notes=correct?[523,659,784]:[180,120];
 notes.forEach((freq,i)=>{
  const o=ctx.createOscillator(),g=ctx.createGain(),t=now+i*.1;
  o.connect(g);g.connect(ctx.destination);
  o.type="sine";o.frequency.value=freq;
  g.gain.setValueAtTime(.045,t);
  g.gain.exponentialRampToValueAtTime(.001,t+.25);
  o.start(t);o.stop(t+.25);
 });
}
let animation;
function celebrate(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 cancelAnimationFrame(animation);
 const c=$("confetti"),g=c.getContext("2d");
 c.width=innerWidth;c.height=innerHeight;
 const bits=Array.from({length:95},()=>({
  x:Math.random()*c.width,y:-Math.random()*c.height,
  v:2+Math.random()*5,color:["#e0b0ff","#ffdb76","#fff0c4"][rand(0,2)]
 }));
 const begin=performance.now();
 function draw(now){
  g.clearRect(0,0,c.width,c.height);
  bits.forEach(p=>{
   p.y+=p.v;g.fillStyle=p.color;g.fillRect(p.x,p.y,6,10);
  });
  if(now-begin<3000)animation=requestAnimationFrame(draw);
  else g.clearRect(0,0,c.width,c.height);
 }
 animation=requestAnimationFrame(draw);
}
</script>
