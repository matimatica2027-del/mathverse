<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATHVERSE — Математикалық садақшы</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100d24;color:#fff;
font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{max-width:1100px;margin:auto;padding:20px;
display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;letter-spacing:2px;color:#d9c7ff}
button{border:1px solid #ffffff25;border-radius:14px;
padding:12px 18px;background:#ffffff12;color:#fff}
button:hover{background:#ffffff25}
button:disabled{cursor:default;opacity:.55}
main{max-width:1100px;margin:auto;padding:12px 20px 30px}
.panel{background:linear-gradient(130deg,#30214e,#19172f);
border:1px solid #ffffff20;border-radius:24px;padding:24px}
h1{font-size:clamp(28px,5vw,48px);margin:10px 0}
p{line-height:1.6;color:#cec5e3}
.tag{color:#c7a6ff;font-size:13px;letter-spacing:2px}
.fields{display:grid;grid-template-columns:1fr 150px;gap:14px}
label{display:block;color:#dfd5ef;font-size:14px}
input,select{display:block;width:100%;margin-top:8px;
padding:14px;border:1px solid #ad89e958;border-radius:12px;
background:#151127;color:#fff}
option{background:#151127}
.primary{background:linear-gradient(120deg,#9b60ff,#7135ef);
border:0;font-weight:bold;box-shadow:0 8px 30px #7135ef40}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
#notice{color:#ffd995;min-height:24px}
#preview{margin-top:20px}
.preview-item{display:flex;justify-content:space-between;gap:20px;
padding:14px;border-bottom:1px solid #ffffff15;align-items:center}
.frac{display:inline-flex;vertical-align:middle;flex-direction:column;
align-items:center;line-height:1.1;margin:0 5px}
.frac span:first-child{border-bottom:2px solid currentColor;
padding:0 5px 3px}
.frac span:last-child{padding:3px 5px 0}
.math{font-size:clamp(24px,4vw,38px);line-height:1.8}
#game{display:none}
.stats{display:flex;justify-content:space-between;gap:12px;
flex-wrap:wrap;margin-bottom:16px;color:#dfd1ff}
.question{text-align:center;padding:18px;border-radius:20px;
background:#ffffff0b;border:1px solid #ffffff15}
#scene{height:350px;position:relative;overflow:hidden;
border-radius:24px;margin-top:16px;
background:radial-gradient(ellipse at 75% 20%,#b5a5ea55,transparent 35%),
linear-gradient(#302f63,#4c5270 65%,#233f3b 66%,#102e2a)}
#scene:before{content:"";position:absolute;inset:35% -10% 0;
background:#223d46;clip-path:polygon(0 65%,20% 0,40% 60%,65% 10%,100% 65%,100% 100%,0 100%)}
#scene:after{content:"";position:absolute;inset:65% -10% -30%;
border-radius:50%;background:#163a32;transform:rotate(-6deg)}
.moon{position:absolute;right:13%;top:30px;width:48px;height:48px;
border-radius:50%;background:#f1e4bb;box-shadow:0 0 55px #fff3bb66}
.tree{position:absolute;bottom:45px;width:75px;height:200px;
background:#102e30;clip-path:polygon(50% 0,85% 40%,65% 40%,100% 75%,
58% 75%,58% 100%,42% 100%,42% 75%,0 75%,35% 40%,15% 40%)}
#archer{position:absolute;left:5%;bottom:30px;width:155px;height:220px;
z-index:2;filter:drop-shadow(0 10px 10px #0005)}
#bow{transform-origin:100px 100px}
.shooting #bow{animation:draw .65s ease}
@keyframes draw{50%{transform:scaleX(.8)}}
#arrow{position:absolute;z-index:5;left:150px;top:190px;
font-size:50px;color:#ffe5a2;line-height:1;pointer-events:none;opacity:0;
text-shadow:0 0 12px #ffdb80}
#targets{position:absolute;z-index:3;right:5%;top:34px;
width:48%;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.target{min-height:105px;border-radius:50%;padding:10px;
border:7px solid #d1a161;
background:radial-gradient(circle,#7951a8 0 28%,#f0dfbd 29% 48%,
#71518b 49% 67%,#f0dfbd 68%);
box-shadow:0 8px 0 #805f3b,0 12px 25px #0006;
font-weight:bold;text-shadow:0 1px 3px #000;color:white}
.target:hover{transform:translateY(-4px);
background:radial-gradient(circle,#9364cd 0 28%,#fff2d1 29% 48%,
#9267b0 49% 67%,#fff2d1 68%)}
.target .math{font-size:25px}
.target.hit{box-shadow:0 0 45px #ffdc69;animation:hit .5s}
.target.miss{animation:shake .4s}
@keyframes hit{50%{transform:scale(1.16)}}
@keyframes shake{25%,75%{transform:translateX(-8px)}
50%{transform:translateX(8px)}}
#feedback{text-align:center;min-height:54px;padding:16px;
font-size:18px;font-weight:bold}
#next{display:none;margin:0 auto}
#result{display:none;text-align:center;padding:45px 20px}
#result h2{font-size:36px}
#stars{font-size:54px;color:#ffdb70}
footer{text-align:center;padding:20px;color:#b3a5cb;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.soundbar{display:flex;gap:10px;align-items:center}
#volume{width:80px;margin:0;padding:0;accent-color:#b184ff}
@media(max-width:600px){
header{padding:15px}.brand{font-size:13px}
main{padding:8px 12px}.panel{padding:18px}
.fields{grid-template-columns:1fr}
#scene{height:340px}#archer{left:-15px;width:125px;bottom:20px}
#targets{right:4%;width:62%;gap:20px 12px;top:45px}
.target{min-height:105px;border-width:5px}
.target .math{font-size:22px}
.soundbar{gap:5px}#volume{width:50px}
}
@media(prefers-reduced-motion:reduce){
*,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<main>

Дұрыс жауап тұрған нысананы таңдап, жебе ұшырыңыз!</p>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const F=(n,d=1)=>{
 if(!d)throw Error("Нөлге бөлуге болмайды");
 if(d<0){n=-n;d=-d}
 const g=gcd(n,d);return {n:n/g,d:d/g};
};
const key=a=>a.n+"/"+a.d;
const eq=(a,b)=>a.n*b.d===b.n*a.d;
const frac=(n,d)=>'<span class="frac"><span>'+n+
'</span><span>'+d+'</span></span>';
function show(a){
 if(a.d===1)return String(a.n);
 const w=Math.floor(a.n/a.d),r=a.n%a.d;
 return w? w+" "+frac(r,a.d):frac(a.n,a.d);
}
function proper(){
 const d=rand(2,12);return F(rand(1,d-1),d);
}
function mixed(){
 const a=proper();return F(rand(1,4)*a.d+a.n,a.d);
}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];
 }return a;
}
function identify(text){
 const t=text.toLowerCase().replace(/ё/g,"е");
 const mix=t.includes("аралас");
 if(t.includes("ортақ")&&t.includes("бөлім"))return "common";
 if(t.includes("салыстыр"))return mix?"mcompare":"compare";
 if(t.includes("кері"))return "inverse";
 const ops=[];
 if(t.includes("қосу")||t.includes("қосынды"))ops.push("add");
 if(t.includes("азайт")||t.includes("айырма"))ops.push("sub");
 if(t.includes("көбей"))ops.push("mul");
 if(t.includes("бөлу")||t.includes("бөлің"))ops.push("div");
 if(!ops.length)return null;
 return (mix?"m":"")+ops[rand(0,ops.length-1)];
}
function choices(answer){
 const out=[answer];
 let tries=0;
 while(out.length<4&&tries++<100){
  const x=F(rand(1,Math.max(12,answer.n+8)),rand(1,12));
  if(!out.some(y=>eq(x,y)))out.push(x);
 }
 for(let i=1;out.length<4;i++){
  const x=F(answer.n+i*answer.d,answer.d);
  if(!out.some(y=>eq(x,y)))out.push(x);
 }
 return shuffle(out).map(a=>({html:show(a),correct:eq(a,answer)}));
}
function make(type){
 if(type==="common"){
  let a=proper(),b=proper();
  while(a.d===b.d)b=proper();
  const d=lcm(a.d,b.d),n=a.n*(d/a.d),m=b.n*(d/b.d);
  const correct=frac(n,d)+" және "+frac(m,d);
  const opts=[
   {html:correct,correct:true},
   {html:frac(n+1,d)+" және "+frac(m,d),correct:false},
   {html:frac(n,d)+" және "+frac(m+1,d),correct:false},
   {html:frac(n+1,d)+" және "+frac(m+1,d),correct:false}
  ];
  return {label:"Ең кіші ортақ бөлімге келтіріңіз",
   q:show(a)+" және "+show(b),options:shuffle(opts),answer:correct};
 }
 if(type==="inverse"){
  const a=Math.random()<.5?proper():mixed(),r=F(a.d,a.n);
  return {label:"Өзара кері санды табыңыз",q:show(a),
   options:choices(r),answer:show(r)};
 }
 const isMixed=type.startsWith("m");
 const op=isMixed?type.slice(1):type;
 let a=isMixed?mixed():proper(),b=isMixed?mixed():proper();
 if(op==="compare"){
  const c=a.n*b.d-b.n*a.d,ans=c===0?"=":c>0?">":"<";
  return {label:"Қай белгі дұрыс?",q:show(a)+" ☐ "+show(b),
   options:shuffle(["<","=",">"].map(x=>({
    html:x===">"?"&gt;":x==="<"?"&lt;":"=",correct:x===ans}))),
   answer:ans===">"?"&gt;":ans==="<"?"&lt;":"="};
 }
 if(op==="sub"&&a.n*b.d<b.n*a.d)[a,b]=[b,a];
 let r,s;
 if(op==="add"){r=F(a.n*b.d+b.n*a.d,a.d*b.d);s="+"}
 if(op==="sub"){r=F(a.n*b.d-b.n*a.d,a.d*b.d);s="−"}
 if(op==="mul"){r=F(a.n*b.n,a.d*b.d);s="×"}
 if(op==="div"){r=F(a.n*b.d,a.d*b.n);s="÷"}
 return {label:"Есептеңіз",q:show(a)+" "+s+" "+show(b),
  options:choices(r),answer:show(r)};
}

let tasks=[],index=0,points=0,streak=0,locked=false;
let firstTry=true,perfect=0,gameToken=0;
function generate(){
 const text=$("topic").value.trim();
 if(!identify(text)){
  $("notice").textContent=
   "Тақырып танылмады. Тізімнен бөлшектер туралы тақырып таңдаңыз.";
  $("start").hidden=true;$("preview").replaceChildren();tasks=[];return false;
 }
 tasks=[];const seen=new Set();let tries=0;
 while(tasks.length<Number($("count").value)&&tries++<1000){
  const task=make(identify(text));
  if(!seen.has(task.q)){seen.add(task.q);tasks.push(task)}
 }
 $("preview").innerHTML="<p>Мұғалімге алдын ала қарау · "+
 tasks.length+" тапсырма</p>"+tasks.map((t,i)=>
 '<div class="preview-item"><span>'+(i+1)+'. '+t.q+
 '</span><span style="color:#c9ffa7">'+t.answer+'</span></div>').join("");
 $("notice").textContent=
  "Есептер дайын. Жаңарту үшін «Есептерді дайындау» батырмасын қайта басыңыз.";
 $("start").hidden=false;return true;
}
$("generate").onclick=generate;
$("topic").oninput=()=>{
 $("start").hidden=true;tasks=[];$("preview").replaceChildren();
 $("notice").textContent="";
};
$("count").onchange=$("topic").oninput;

function start(){
 if(!tasks.length&&!generate())return;
 gameToken++;index=0;points=0;streak=0;perfect=0;
 $("setup").style.display="none";$("result").style.display="none";
 $("game").style.display="block";render();
}
function render(){
 locked=false;firstTry=true;
 $("progress").textContent="Тапсырма "+(index+1)+" / "+tasks.length;
 $("score").textContent="✦ "+points+" ұпай";
 $("taskLabel").textContent=tasks[index].label;
 $("question").innerHTML=tasks[index].q;
 $("feedback").textContent="Дұрыс жауап тұрған нысананы таңдаңыз.";
 $("next").style.display="none";$("targets").replaceChildren();
 tasks[index].options.forEach(opt=>{
  const b=document.createElement("button");
  b.className="target";b.innerHTML='<span class="math">'+opt.html+'</span>';
  b.onclick=()=>shoot(b,opt);
  $("targets").append(b);
 });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function shoot(button,opt){
 if(locked)return;locked=true;
 const token=gameToken;
 $("targets").querySelectorAll("button").forEach(b=>b.disabled=true);
 $("archer").classList.add("shooting");sfx(220,.1);
 await wait(450);if(token!==gameToken)return;
 const scene=$("scene").getBoundingClientRect();
 const target=button.getBoundingClientRect();
 const archer=$("archer").getBoundingClientRect();
 const x=archer.right-scene.left-15,y=archer.top-scene.top+95;
 const dx=target.left-scene.left+target.width/2-x;
 const dy=target.top-scene.top+target.height/2-y+(opt.correct?0:55);
 const arrow=$("arrow");
 arrow.style.left=x+"px";arrow.style.top=y+"px";arrow.style.opacity="1";
 const angle=Math.atan2(dy,dx)*180/Math.PI;
 const flight=arrow.animate([
  {transform:"translate(0,0) rotate("+(angle+45)+"deg)"},
  {transform:"translate("+dx+"px,"+dy+"px) rotate("+(angle+45)+"deg)"}
 ],{duration:550,easing:"ease-in",fill:"forwards"});
 await flight.finished;if(token!==gameToken){flight.cancel();return}
 arrow.style.opacity="0";flight.cancel();
 $("archer").classList.remove("shooting");
 if(opt.correct){
  button.classList.add("hit");sfx(660,.16);
  if(firstTry){points+=10;perfect++;streak++}else{points+=5;streak=0}
  $("score").textContent="✦ "+points+" ұпай";
  $("feedback").textContent=streak&&streak%3===0?
   "🔥 Үш дәл соққы қатарынан! +10 ұпай":
   firstTry?"✦ Дәл тиді! +10 ұпай":"✦ Дұрыс! +5 ұпай";
  if(streak&&streak%3===0)celebrate();
  $("next").style.display="block";
 }else{
  button.classList.add("miss");sfx(130,.2);firstTry=false;streak=0;
  $("feedback").textContent="Жебе мүлт кетті. Есепті қайта қарап көріңіз!";
  await wait(400);if(token!==gameToken)return;
  button.classList.remove("miss");
  $("targets").querySelectorAll("button").forEach(b=>b.disabled=b===button||b.dataset.wrong==="1");
  button.dataset.wrong="1";locked=false;
 }
}
$("next").onclick=()=>{
 index++;
 if(index<tasks.length)render();
 else{
  gameToken++;$("game").style.display="none";$("result").style.display="block";
  const ratio=points/(tasks.length*10);
  $("stars").textContent=ratio>=.9?"★★★":ratio>=.65?"★★☆":"★☆☆";
  $("summary").textContent=points+" / "+tasks.length*10+
   " ұпай. Алғашқы әрекеттен дұрыс: "+perfect+" / "+tasks.length+".";
  celebrate();
 }
};
function back(){
 gameToken++;$("game").style.display="none";$("result").style.display="none";
 $("setup").style.display="block";$("arrow").style.opacity="0";
 $("archer").classList.remove("shooting");
}
$("start").onclick=start;$("back").onclick=back;$("choose").onclick=back;
$("again").onclick=()=>{if(generate())start()};

let sound=false,audioContext;
$("sound").onclick=async()=>{
 const music=$("music");
 if(sound){music.pause();sound=false}
 else{
  try{
   music.volume=Number($("volume").value);await music.play();sound=true;
   const AC=window.AudioContext||window.webkitAudioContext;
   if(AC){audioContext=audioContext||new AC();await audioContext.resume()}
  }catch(e){
   $("notice").textContent="Күй ашылмады. adai.mp3 файлы осы папкада болуы керек.";
   alert("Күй ашылмады. GitHub-та adai.mp3 файлы жүктелгенін тексеріңіз.");
  }
 }
 $("sound").textContent=sound?"♫ Күйді өшіру":"♫ Күйді қосу";
 $("sound").setAttribute("aria-pressed",String(sound));
};
$("volume").oninput=()=>{$("music").volume=Number($("volume").value)};
function sfx(freq,duration){
 if(!sound||!audioContext)return;
 const o=audioContext.createOscillator(),g=audioContext.createGain();
 o.connect(g);g.connect(audioContext.destination);o.frequency.value=freq;
 const t=audioContext.currentTime;
 g.gain.setValueAtTime(.045,t);
 g.gain.exponentialRampToValueAtTime(.001,t+duration);
 o.start(t);o.stop(t+duration);
}
let confettiFrame;
function celebrate(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 cancelAnimationFrame(confettiFrame);
 const c=$("confetti"),ctx=c.getContext("2d");
 c.width=innerWidth;c.height=innerHeight;
 const bits=Array.from({length:85},()=>({
  x:Math.random()*c.width,y:-Math.random()*c.height,
  vx:(Math.random()-.5)*3,vy:2+Math.random()*4,
  color:["#c5a1ff","#ffd873","#91e6c2","#fff"][rand(0,3)]
 }));
 const begin=performance.now();
 function frame(now){
  ctx.clearRect(0,0,c.width,c.height);
  bits.forEach(p=>{p.x+=p.vx;p.y+=p.vy;
   ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,6,10)});
  if(now-begin<2800)confettiFrame=requestAnimationFrame(frame);
  else ctx.clearRect(0,0,c.width,c.height);
 }
 confettiFrame=requestAnimationFrame(frame);
}
</script>
