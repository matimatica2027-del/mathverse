<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MATHVERSE — Бөлшектер жарысы</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c1023;color:#fff;font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid #bca6ff45;border-radius:14px;
background:#ffffff12;color:white;padding:13px 18px}
button:hover{background:#ffffff25}
button:disabled{cursor:default}
header,main,footer{max-width:1150px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;color:#d9baff;letter-spacing:2px}
.audio{display:flex;align-items:center;gap:8px}
#volume{width:65px;accent-color:#bc8fff}
.panel{padding:25px;border:1px solid #aa8fff35;border-radius:24px;
background:linear-gradient(130deg,#272342,#11182b)}
h1{font-size:clamp(30px,5vw,50px);margin:12px 0}
p{color:#c8c9de;line-height:1.6}
label{display:block;font-size:14px;color:#ddd7ee}
input[type=text],select{width:100%;display:block;margin-top:8px;
padding:14px;background:#10152b;color:white;
border:1px solid #bca6ff55;border-radius:12px}
.fields{display:grid;grid-template-columns:1fr 150px;gap:15px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.primary{background:linear-gradient(120deg,#9f62fa,#6944e8);
font-weight:bold;border:0;box-shadow:0 6px 25px #9e5cff30}
.frac{display:inline-flex;flex-direction:column;align-items:center;
vertical-align:middle;line-height:1.1;margin:0 5px}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 4px 3px}
.frac>span:last-child{padding:3px 4px 0}
.preview{display:flex;justify-content:space-between;align-items:center;
padding:15px 0;gap:18px;border-bottom:1px solid #ffffff15;font-size:21px}
#notice{min-height:25px;color:#ffdb91}
#game,#result{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;
gap:12px;flex-wrap:wrap;margin-bottom:14px}
#track{position:relative;height:50px;background:#080d1d;border-radius:14px;
border:1px solid #ffffff25;margin-bottom:16px;overflow:hidden}
#track:before{content:"";position:absolute;top:25px;left:15px;right:15px;
border-top:2px dashed #ffffff40}
#car{position:absolute;left:2%;top:4px;font-size:31px;
transition:left 1s cubic-bezier(.2,.8,.2,1);transform:scaleX(-1)}
.finish{position:absolute;right:8px;top:7px;font-size:27px}
#arena{position:relative;overflow:hidden;border-radius:22px;
min-height:540px;background:#1a2241}
#background{position:absolute;inset:0;
background:url("./race-bg.png") center/cover no-repeat;
transition:transform 1s,filter 1s}
#arena:after{content:"";position:absolute;inset:0;pointer-events:none;
background:linear-gradient(#070b2655,transparent 45%,#070b26e8)}
#arena.boost #background{transform:scale(1.06);filter:brightness(1.25)}
#arena.brake #background{filter:brightness(.65)}
#speedLines{position:absolute;inset:0;pointer-events:none;
opacity:0;z-index:1;background:repeating-linear-gradient(165deg,
transparent 0 55px,#c99dff55 56px,transparent 58px 110px)}
.boost #speedLines{animation:rush .22s linear 5}
@keyframes rush{from{opacity:.6;transform:translateX(0)}
to{opacity:0;transform:translateX(-60px)}}
.question{position:relative;z-index:2;margin:20px auto;
max-width:650px;width:calc(100% - 32px);padding:17px;text-align:center;
border:1px solid #d4baff60;border-radius:18px;
background:#101329d9;backdrop-filter:blur(8px)}
#question{font-size:clamp(28px,4vw,42px);line-height:1.9}
#label{color:#d7c9ef;font-size:14px}
#answers{position:absolute;bottom:22px;left:20px;right:20px;
display:grid;grid-template-columns:repeat(4,1fr);gap:12px;z-index:3}
.answer{min-height:94px;background:#151a35ed;border:2px solid #b385f0;
box-shadow:0 0 20px #9d52ee25;font-size:27px;font-weight:bold}
.answer.correct{background:#225844;border-color:#8af0bd;
box-shadow:0 0 30px #69e9aa66}
.answer.wrong{background:#61313e;border-color:#ff9ba9}
#feedback{text-align:center;min-height:55px;padding:16px;
font-weight:bold;font-size:18px}
#next{display:none;margin:auto}
#result{text-align:center;padding:45px 20px}
#stars{font-size:60px;color:#ffdc7c}
footer{text-align:center;color:#a9a3be;font-size:13px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media(max-width:650px){
header,main{padding:12px}.brand{font-size:13px}.panel{padding:17px}
.fields{grid-template-columns:1fr}
#arena{min-height:560px}
#background{background-size:auto 100%;background-position:38% center}
#answers{grid-template-columns:1fr 1fr;gap:10px;left:12px;right:12px}
.answer{min-height:85px;font-size:25px}
.question{margin-top:12px;padding:12px}
.audio{gap:4px}#volume{width:45px}
}
@media(prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
<div class="brand">MATHVERSE ✦</div>
<div class="audio">
<button id="sound" aria-pressed="false">♫ Күйді қосу</button>
<input id="volume" type="range" min="0" max="1" step=".05"
value=".25" aria-label="Музыка дыбысы">
</div>
</header>
<main>
<section id="setup" class="panel">
<p>5-СЫНЫП · II ТОҚСАН</p>
<h1>Бөлшектер жарысы</h1>
<p>Тақырыпты енгізіңіз. Әр дұрыс жауап көлігіңізді мәреге жақындатады!</p>
<div class="fields">
<label>Сабақтың тақырыбы
<input type="text" id="topic" list="topics"
placeholder="Мысалы: Аралас сандарды қосу">
<datalist id="topics">
<option value="Жай бөлшектерді ортақ бөлімге келтіру">
<option value="Жай бөлшектерді салыстыру">
<option value="Аралас сандарды салыстыру">
<option value="Жай бөлшектерді қосу және азайту">
<option value="Аралас сандарды қосу және азайту">
<option value="Жай бөлшектерді көбейту">
<option value="Аралас сандарды көбейту">
<option value="Өзара кері сандар">
<option value="Жай бөлшектерді бөлу">
<option value="Аралас сандарды бөлу">
</datalist>
</label>
<label>Есеп саны
<select id="count"><option>5</option><option selected>10</option>
<option>15</option></select>
</label>
</div>
<div class="actions">
<button id="generate" class="primary">✦ Есептерді дайындау</button>
<button id="start" hidden>Жарысты бастау →</button>
</div>
<p id="notice" role="status"></p>
<div id="preview"></div>
</section>

<section id="game" class="panel">
<div class="hud">
<span id="progress"></span><strong id="score"></strong>
<span id="distance"></span><button id="back">← Тақырыпқа қайту</button>
</div>
<div id="track" aria-label="Мәреге дейінгі ілгерілеу">
<span id="car">🏎️</span><span class="finish">🏁</span>
</div>
<div id="arena">
<div id="background"></div><div id="speedLines"></div>
<div class="question">
<div id="label"></div><div id="question"></div>
</div>
<div id="answers"></div>
</div>

<button id="next" class="primary">Келесі тапсырма →</button>
</section>

<div id="stars"></div><h1>Мәреге жеттіңіз!</h1>

<button id="again" class="primary">Қайта жарысу</button>
<button id="choose">Тақырыпты өзгерту</button>
</section>
</main>
<footer>Авторы: Қонысғали Нұрасыл · MATHVERSE</footer>
<canvas id="confetti"></canvas>
<audio id="music" src="./adai.mp3" loop preload="none"></audio>

<script>
"use strict";
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function F(n,d=1){
 if(!d)throw Error("Нөлге бөлу");
 if(d<0){n=-n;d=-d}
 const g=gcd(n,d);return{n:n/g,d:d/g};
}
const equal=(a,b)=>a.n*b.d===b.n*a.d;
function fraction(n,d){
 return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';
}
function show(a){
 if(a.d===1)return String(a.n);
 const w=Math.floor(a.n/a.d),r=a.n%a.d;
 return (w?w+" ":"")+fraction(r,a.d);
}
function proper(){const d=rand(2,12);return F(rand(1,d-1),d)}
function mixed(){const a=proper();return F(rand(1,4)*a.d+a.n,a.d)}
function shuffle(a){
 for(let i=a.length-1;i>0;i--){
  const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];
 }return a;
}
function parse(text){
 const t=text.toLowerCase().trim();
 if(t.includes("ортақ")&&t.includes("бөлім"))return["common"];
 if(t.includes("салыстыр"))return[t.includes("аралас")?"mcompare":"compare"];
 if(t.includes("кері"))return["inverse"];
 const ops=[],prefix=t.includes("аралас")?"m":"";
 if(t.includes("қосу")||t.includes("қосынды"))ops.push(prefix+"add");
 if(t.includes("азайт")||t.includes("айырма"))ops.push(prefix+"sub");
 if(t.includes("көбей"))ops.push(prefix+"mul");
 if(t.includes("бөлу")||t.includes("бөлің"))ops.push(prefix+"div");
 return ops;
}
function options(answer){
 const a=[answer];let tries=0;
 while(a.length<4&&tries++<100){
  const b=F(rand(1,Math.max(15,answer.n+8)),rand(1,12));
  if(!a.some(x=>equal(x,b)))a.push(b);
 }
 for(let i=1;a.length<4;i++){
  const b=F(answer.n+i*answer.d,answer.d);
  if(!a.some(x=>equal(x,b)))a.push(b);
 }
 return shuffle(a).map(x=>({html:show(x),correct:equal(x,answer)}));
}
function make(type){
 if(type==="common"){
  let a=proper(),b=proper();while(a.d===b.d)b=proper();
  const d=a.d/gcd(a.d,b.d)*b.d,n=a.n*d/a.d,m=b.n*d/b.d;
  const pair=(x,y)=>fraction(x,d)+" және "+fraction(y,d);
  return{label:"Ең кіші ортақ бөлімге келтіріңіз",
   q:show(a)+" және "+show(b),answer:pair(n,m),
   options:shuffle([
    {html:pair(n,m),correct:true},
    {html:pair(n+1,m),correct:false},
    {html:pair(n,m+1),correct:false},
    {html:pair(n+1,m+1),correct:false}
   ])};
 }
 if(type==="inverse"){
  const a=Math.random()<.5?proper():mixed(),r=F(a.d,a.n);
  return{label:"Кері санды табыңыз",q:show(a),answer:show(r),options:options(r)};
 }
 const m=type.startsWith("m"),op=m?type.slice(1):type;
 let a=m?mixed():proper(),b=m?mixed():proper();
 if(op==="compare"){
  const x=a.n*b.d-b.n*a.d,answer=x===0?"=":x>0?"&gt;":"&lt;";
  return{label:"Қай белгі дұрыс?",q:show(a)+" ☐ "+show(b),answer,
   options:shuffle(["&lt;","=","&gt;"].map(html=>({
    html,correct:html===answer})))};
 }
 if(op==="sub"&&a.n*b.d<b.n*a.d)[a,b]=[b,a];
 let r,s;
 if(op==="add"){r=F(a.n*b.d+b.n*a.d,a.d*b.d);s="+"}
 if(op==="sub"){r=F(a.n*b.d-b.n*a.d,a.d*b.d);s="−"}
 if(op==="mul"){r=F(a.n*b.n,a.d*b.d);s="×"}
 if(op==="div"){r=F(a.n*b.d,a.d*b.n);s="÷"}
 return{label:"Есептеңіз",q:show(a)+" "+s+" "+show(b),
  answer:show(r),options:options(r)};
}
let tasks=[],index=0,points=0,perfect=0,streak=0;
let locked=false,first=true,token=0;
function generate(){
 const types=parse($("topic").value);
 if(!types.length){
  $("notice").textContent="Тақырып танылмады. Ұсынылған тақырыптардың бірін таңдаңыз.";
  tasks=[];$("preview").replaceChildren();$("start").hidden=true;return false;
 }
 tasks=[];const seen=new Set();let tries=0;
 while(tasks.length<Number($("count").value)&&tries++<1000){
  const t=make(types[rand(0,types.length-1)]);
  if(!seen.has(t.q)){seen.add(t.q);tasks.push(t)}
 }
 $("preview").innerHTML="<p>Мұғалімге алдын ала қарау</p>"+
 tasks.map((t,i)=>'<div class="preview"><span>'+(i+1)+'. '+t.q+
 '</span><span style="color:#aef3c5">'+t.answer+'</span></div>').join("");
 $("notice").textContent=tasks.length+" есеп дайын. Жаңадан дайындауға болады.";
 $("start").hidden=false;return true;
}
function invalidate(){
 tasks=[];$("preview").replaceChildren();$("start").hidden=true;
 $("notice").textContent="";
}
$("topic").oninput=invalidate;$("count").onchange=invalidate;
$("generate").onclick=generate;
function start(){
 if(!tasks.length&&!generate())return;
 token++;index=0;points=0;perfect=0;streak=0;
 $("setup").style.display="none";$("result").style.display="none";
 $("game").style.display="block";$("car").style.left="2%";render();
}
function render(){
 locked=false;first=true;
 $("arena").classList.remove("boost","brake");
 $("progress").textContent="Тапсырма "+(index+1)+" / "+tasks.length;
 $("score").textContent="✦ "+points+" ұпай";
 $("distance").textContent="Мәреге: "+(tasks.length-index)+" қадам";
 $("label").textContent=tasks[index].label;
 $("question").innerHTML=tasks[index].q;
 $("feedback").textContent="Дұрыс жауапты таңдап, алға ұмтылыңыз!";
 $("next").style.display="none";
 $("answers").replaceChildren();
 tasks[index].options.forEach(opt=>{
  const b=document.createElement("button");b.className="answer";
  b.innerHTML=opt.html;b.onclick=()=>answer(b,opt);
  $("answers").append(b);
 });
}
async function answer(button,opt){
 if(locked)return;
 locked=true;const current=token;
 const buttons=[...$("answers").children];
 buttons.forEach(b=>b.disabled=true);
 if(opt.correct){
  button.classList.add("correct");
  points+=first?10:5;
  if(first){perfect++;streak++}else streak=0;
  $("score").textContent="✦ "+points+" ұпай";
  $("car").style.left=(2+82*(index+1)/tasks.length)+"%";
  $("distance").textContent="Мәреге: "+(tasks.length-index-1)+" қадам";
  $("arena").classList.add("boost");effect(true);
  $("feedback").textContent=streak&&streak%3===0?
   "🔥 Үш дұрыс жауап қатарынан! Нитро үдеу!":
   first?"Дұрыс! +10 ұпай. Көлік алға жылжыды!":
   "Дұрыс! +5 ұпай. Жарыс жалғасады!";
  $("next").style.display="block";
 }else{
  first=false;streak=0;button.dataset.wrong="1";
  button.classList.add("wrong");$("arena").classList.add("brake");effect(false);
  $("feedback").textContent="Көлік баяулады. Қайта есептеп көріңіз!";
  await new Promise(r=>setTimeout(r,700));
  if(current!==token)return;
  $("arena").classList.remove("brake");
  buttons.forEach(b=>b.disabled=b.dataset.wrong==="1");locked=false;
 }
}
$("next").onclick=()=>{
 index++;
 if(index<tasks.length)render();
 else{
  token++;$("game").style.display="none";$("result").style.display="block";
  const ratio=points/(tasks.length*10);
  $("stars").textContent=ratio>=.9?"★★★":ratio>=.65?"★★☆":"★☆☆";
  $("summary").textContent=points+" / "+tasks.length*10+
   " ұпай. Бірінші әрекеттен дұрыс: "+perfect+" / "+tasks.length+".";
  celebrate();
 }
};
function back(){
 token++;$("game").style.display="none";$("result").style.display="none";
 $("setup").style.display="block";
}
$("start").onclick=start;$("back").onclick=back;$("choose").onclick=back;
$("again").onclick=()=>{if(generate())start()};

let sound=false,ctx;
$("sound").onclick=async()=>{
 if(sound){$("music").pause();sound=false}
 else{
  try{
   $("music").volume=Number($("volume").value);
   await $("music").play();sound=true;
   const AC=window.AudioContext||window.webkitAudioContext;
   if(AC){ctx=ctx||new AC();await ctx.resume()}
  }catch(e){alert("Күй ашылмады. adai.mp3 файлын тексеріңіз.")}
 }
 $("sound").textContent=sound?"♫ Күйді өшіру":"♫ Күйді қосу";
 $("sound").setAttribute("aria-pressed",String(sound));
};
$("volume").oninput=()=>{$("music").volume=Number($("volume").value)};
function effect(correct){
 if(!sound||!ctx)return;
 const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;
 o.connect(g);g.connect(ctx.destination);o.type="triangle";
 o.frequency.setValueAtTime(correct?160:220,t);
 o.frequency.exponentialRampToValueAtTime(correct?650:80,t+.35);
 g.gain.setValueAtTime(.05,t);
 g.gain.exponentialRampToValueAtTime(.001,t+.4);
 o.start(t);o.stop(t+.4);
}
let animation;
function celebrate(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 cancelAnimationFrame(animation);
 const c=$("confetti"),g=c.getContext("2d");
 c.width=innerWidth;c.height=innerHeight;
 const bits=Array.from({length:100},()=>({
  x:Math.random()*c.width,y:-Math.random()*c.height,
  v:2+Math.random()*5,color:["#be8fff","#ffdc79","#9ff6ca"][rand(0,2)]
 }));
 const start=performance.now();
 function draw(now){
  g.clearRect(0,0,c.width,c.height);
  bits.forEach(p=>{p.y+=p.v;g.fillStyle=p.color;g.fillRect(p.x,p.y,6,11)});
  if(now-start<3200)animation=requestAnimationFrame(draw);
  else g.clearRect(0,0,c.width,c.height);
 }
 animation=requestAnimationFrame(draw);
}
</script>

<script>
(() => {
  const arena = document.getElementById("arena");
  const marker = document.getElementById("car");
  const next = document.getElementById("next");

  if (!arena || !marker || !next) return;

  const vehicle = document.createElement("div");
  vehicle.id = "moving-car";

  const picture = document.createElement("img");
  picture.src = "./race-car.png";
  picture.alt = "Күлгін жарыс көлігі";
  picture.draggable = false;

  vehicle.append(picture);
  arena.append(vehicle);

  const message = document.createElement("div");
  message.id = "drive-message";
  message.textContent = "Жарысқа дайын";
  arena.append(message);

  picture.addEventListener("error", () => {
    message.textContent = "race-car.png файлы ашылмады";
  });

  /*
    x, y — көліктің жолдағы орны, пайызбен.
    w — алыстаған сайын кішірейетін ені.
  */
  const route = [
    { p: 0,    x: 24, y: 85, w: 39 },
    { p: 0.22, x: 46, y: 76, w: 30 },
    { p: 0.45, x: 68, y: 65, w: 21 },
    { p: 0.65, x: 84, y: 54, w: 13 },
    { p: 0.82, x: 90, y: 45, w: 8 },
    { p: 1,    x: 87, y: 38, w: 4.5 }
  ];

  function position(progress) {
    let i = 1;
    while (i < route.length - 1 && progress > route[i].p) i++;

    const a = route[i - 1];
    const b = route[i];
    const t = Math.max(0, Math.min(1,
      (progress - a.p) / (b.p - a.p)
    ));

    vehicle.style.left = (a.x + (b.x - a.x) * t) + "%";
    vehicle.style.top = (a.y + (b.y - a.y) * t) + "%";
    vehicle.style.width = (a.w + (b.w - a.w) * t) + "%";
  }

  let current = 0;
  let frame = 0;
  let generation = 0;

  position(0);

  function drive(destination) {
    const start = current;
    const ticket = ++generation;

    cancelAnimationFrame(frame);
    vehicle.classList.remove("braking");
    vehicle.classList.add("accelerating");

    message.textContent = "Үдеу! Мәреге қарай!";
    next.disabled = true;

    const duration =
      matchMedia("(prefers-reduced-motion: reduce)").matches ? 1 : 1600;
    const started = performance.now();

    function animate(now) {
      if (ticket !== generation) return;

      const t = Math.min(1, (now - started) / duration);
      const ease = t * t * (3 - 2 * t);

      current = start + (destination - start) * ease;
      position(current);

      if (t < 1) {
        frame = requestAnimationFrame(animate);
      } else {
        vehicle.classList.remove("accelerating");
        next.disabled = false;
        message.textContent = destination >= 0.999
          ? "🏁 Мәреге жеттіңіз!"
          : "Келесі есепті шешіңіз";
      }
    }

    frame = requestAnimationFrame(animate);
  }

  /* Негізгі ойынның ілгерілеуін нақты көлікке байланыстыру */
  new MutationObserver(() => {
    const value = parseFloat(marker.style.left);

    if (!Number.isFinite(value)) return;

    const destination = Math.max(0, Math.min(1, (value - 2) / 82));

    if (destination === 0) {
      generation++;
      cancelAnimationFrame(frame);
      current = 0;
      position(0);
      vehicle.classList.remove("accelerating", "braking");
      next.disabled = false;
      message.textContent = "Жарысқа дайын";
    } else if (Math.abs(destination - current) > 0.001) {
      drive(destination);
    }
  }).observe(marker, {
    attributes: true,
    attributeFilter: ["style"]
  });

  new MutationObserver(() => {
    const braking = arena.classList.contains("brake");
    vehicle.classList.toggle("braking", braking);

    if (braking) {
      message.textContent = "Тежелді! Қайта есептеңіз";
    } else if (!vehicle.classList.contains("accelerating") && current < 1) {
      message.textContent = "Дұрыс жауапты таңдаңыз";
    }
  }).observe(arena, {
    attributes: true,
    attributeFilter: ["class"]
  });
})();
                             </script>
</body>
  </html>
